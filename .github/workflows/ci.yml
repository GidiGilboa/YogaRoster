name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same branch/PR so pushes don't queue up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Run unit tests
        run: npm run test:unit

  integration:
    name: Integration tests + coverage
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Every test file spins up its own throwaway SQLite database (see
      # src/test/testDb.ts) — nothing here touches real data, and nothing
      # needs to be seeded or torn down manually.
      - name: Run unit + integration tests with coverage
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e:
    name: End-to-end tests
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        # Full journey suite on PRs targeting main (where a slower, more
        # thorough gate is worth the time); a fast, tagged smoke subset on
        # every other push, so day-to-day commits stay quick. This trade-off
        # is documented in qa-test-plan.md rather than silently skipping
        # coverage.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "main" ]; then
            echo "Running full e2e suite (PR targeting main)"
            npm run test:e2e
          else
            echo "Running fast e2e subset (push / non-main PR)"
            npm run test:e2e:fast
          fi
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
